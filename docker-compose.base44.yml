# Base44 sandbox/dev environment for Remix ProcureOS.
# Runs the app straight from the cloned source with the project's own dev
# server (`tsx server.ts` -> Express + Vite dev middleware on port 3000).
services:
  web:
    image: node:22-bookworm
    labels:
      base44.project: "Remix ProcureOS"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Bare pass-throughs: the platform supplies these and Vite consumes them.
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Platform-managed secrets (e.g. GEMINI_API_KEY). Always last so the
      # user's dashboard values win over anything else.
      - /run/base44/app.env
    volumes:
      - .:/app
      # Dependencies live in a volume and are (re)installed at startup from the
      # committed lockfile, so edits to source are picked up without rebuilds.
      - node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund; exec npm run dev
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
